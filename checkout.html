<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Checkout | MyTechShelf</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-wrap">
        <div class="brand"><span class="brand-mark">TS</span><span>MyTechShelf</span></div>
        <nav class="main-nav">
          <a href="/">Home</a>
          <a href="/cart">Cart</a>
        </nav>
      </div>
    </header>

    <main class="cart-page">
      <div class="container checkout-layout">
        <section class="checkout-panel">
          <div class="section-head">
            <div>
              <span class="eyebrow">Checkout</span>
              <h2>Enter your details</h2>
            </div>
          </div>

          <form id="checkoutForm" class="checkout-form">
            <label>
              Full name
              <input type="text" name="name" placeholder="Your name" required />
            </label>
            <label>
              Email
              <input type="email" name="email" placeholder="you@example.com" required />
            </label>
            <label>
              Phone
              <input type="tel" name="phone" placeholder="+91 98xxx xxxxx" required />
            </label>
            <label>
              Address
              <textarea name="address" placeholder="Delivery address" required></textarea>
            </label>
            <button type="submit" class="btn btn-primary">Continue to payment</button>
          </form>

          <p id="checkoutMessage" class="form-message" aria-live="polite"></p>
        </section>
      </div>
    </main>

    <script>
      const form = document.getElementById('checkoutForm');
      const checkoutMessage = document.getElementById('checkoutMessage');

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const formData = new FormData(form);
        const customer = Object.fromEntries(formData.entries());

        if (!customer.name || !customer.email || !customer.phone || !customer.address) {
          checkoutMessage.textContent = 'Please fill in all the checkout details before continuing.';
          return;
        }

        localStorage.setItem('pendingOrder', JSON.stringify({
          customer,
          createdAt: new Date().toISOString()
        }));

        checkoutMessage.textContent = 'Details saved. Redirecting to payment...';
        window.location.href = '/payment';
      });
    </script>
  </body>
</html>
