<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodersLab Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="auth-body">
    <div class="auth-shell">
      <div class="auth-brand">
        <span class="brand-mark">C</span>
        <div>
          <div class="auth-brand-name">CodersLab</div>
          <div class="auth-brand-sub">MyTechShelf Admin</div>
        </div>
      </div>

      <div class="auth-header">
        <h1>Welcome back</h1>
        <p>Sign in to manage books, buyers, and sales.</p>
      </div>

      <form id="loginForm" class="auth-form">
        <label>
          Email address
          <input type="email" id="email" name="email" placeholder="yasminfathima0401@gmail.com" required />
        </label>

        <label>
          Password
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required />
        </label>

        <button type="submit" class="btn btn-primary auth-submit">Login</button>
        <div id="loginError" class="auth-error" aria-live="polite"></div>
      </form>
    </div>

    <script src="/admin-login.js"></script>
  </body>
</html>
