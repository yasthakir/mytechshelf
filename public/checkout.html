<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | MyTechShelf</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-wrap">
        <div class="brand">
          <span class="brand-mark">TS</span>
          <span>MyTechShelf</span>
        </div>
        <nav class="main-nav">
          <a href="/">Home</a>
          <a href="/cart">Cart</a>
        </nav>
        <a href="/cart" class="btn btn-secondary">Back to cart</a>
      </div>
    </header>

    <main class="cart-page">
      <div class="container checkout-layout">
        <section class="checkout-panel">
          <div class="section-head">
            <div>
              <span class="eyebrow">Checkout</span>
              <h2>Proceed with your order</h2>
            </div>
          </div>

          <form id="checkoutForm" class="checkout-form">
            <label>
              Full name
              <input type="text" name="name" placeholder="Your name" required />
            </label>
            <label>
              Email
              <input type="email" name="email" placeholder="you@example.com" required />
            </label>
            <label>
              WhatsApp number
              <input type="tel" name="phone" placeholder="+91 98xxx xxxxx" required />
            </label>
            <label>
              Address
              <textarea name="address" placeholder="Delivery address" required></textarea>
            </label>
            <button type="submit" class="btn btn-primary">Place order</button>
          </form>
          <p id="checkoutMessage" class="form-message" aria-live="polite"></p>
        </section>

        <aside class="checkout-panel">
          <div class="section-head">
            <div>
              <span class="eyebrow">Summary</span>
              <h2>Order overview</h2>
            </div>
          </div>
          <div id="checkoutSummary" class="cart-summary-box"></div>
        </aside>
      </div>
    </main>

    <div id="paymentModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-panel">
        <button class="modal-close" type="button" aria-label="Close payment modal">×</button>
        <div class="modal-head">
          <span class="eyebrow">Secure payment</span>
          <h3>Pay and confirm your order</h3>
        </div>

        <div class="payment-box">
          <div>
            <p class="label">Total amount</p>
            <h4 id="paymentTotalLabel">₹0</h4>
          </div>
          <div class="qr-wrap">
            <img id="checkoutQrImage" src="" alt="UPI QR code" />
          </div>
        </div>

        <p class="upi-note">Scan this QR code using any UPI app. After payment, tick the box below, upload the payment screenshot, and submit.</p>

        <form id="paymentForm" class="order-form" enctype="multipart/form-data">
          <label class="checkbox-row">
            <input type="checkbox" id="paidCheckbox" />
            <span>Paid</span>
          </label>

          <label class="file-upload-label">
            Payment screenshot
            <input type="file" id="paymentScreenshot" name="screenshot" accept="image/*" />
          </label>

          <input type="hidden" id="checkoutBookId" name="bookId" />
          <input type="hidden" id="checkoutAmount" name="amount" />
          <input type="hidden" id="checkoutCustomerName" name="name" />
          <input type="hidden" id="checkoutCustomerEmail" name="email" />
          <input type="hidden" id="checkoutCustomerPhone" name="whatsapp" />
          <input type="hidden" id="checkoutCustomerAddress" name="address" />
          <input type="hidden" id="checkoutPaymentStatus" name="paymentStatus" value="Pending" />

          <button type="submit" class="btn btn-primary submit-btn">Submit payment proof</button>
        </form>

        <p id="paymentModalMessage" class="form-message" aria-live="polite"></p>
      </div>
    </div>

    <script src="/checkout.js"></script>
  </body>
</html>
