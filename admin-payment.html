<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyTechShelf Payment Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="admin-body">
    <header class="topbar admin-bar">
      <div class="container nav-wrap admin-nav-wrap">
        <div class="brand">
          <span class="brand-mark">C</span>
          <span>CodersLab | MyTechShelf</span>
        </div>
        <button type="button" class="admin-menu-toggle" aria-label="Open admin menu" aria-expanded="false">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
        <nav class="admin-nav">
          <a href="/admin/dashboard">Dashboard</a>
          <a href="/admin/books">Add Book</a>
          <a href="/admin/payment" class="active">Payment</a>
          <a href="/admin/buyers">Buyers</a>
        </nav>
        <button type="button" class="btn btn-secondary admin-logout">Logout</button>
      </div>
    </header>

    <main class="admin-page container">
      <section class="admin-grid">
        <div class="admin-panel">
          <div class="panel-head">
            <h2>Payment QR settings</h2>
          </div>
          <form id="paymentForm" class="admin-form" enctype="multipart/form-data">
            <label>
              UPI ID / payment address
              <input type="text" name="upiId" placeholder="yourupi@upi" required />
            </label>
            <label>
              Merchant name
              <input type="text" name="merchantName" placeholder="CodersLab" required />
            </label>
            <label>
              Payment note
              <textarea name="note" rows="3" placeholder="Scan and pay using any UPI app."></textarea>
            </label>
            <label class="file-upload-label">
              QR image upload
              <input type="file" name="qrImage" accept="image/*" />
            </label>
            <button type="submit" class="btn btn-primary">Save payment details</button>
          </form>
          <p id="paymentMessage" class="form-message" aria-live="polite"></p>
        </div>

        <div class="admin-panel">
          <div class="panel-head">
            <h2>QR preview</h2>
          </div>
          <div class="qr-preview-box">
            <img id="paymentQrPreview" src="" alt="Payment QR preview" />
            <p id="paymentPreviewText">No QR uploaded yet.</p>
          </div>
        </div>
      </section>
    </main>

    <script src="/admin-nav.js?v=20261102-1"></script>
    <script src="/admin-payment.js?v=20261102-1"></script>
  </body>
</html>
