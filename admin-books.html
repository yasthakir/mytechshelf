<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodersLab - Add Book</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="admin-body">
    <header class="topbar admin-bar">
      <div class="container nav-wrap admin-nav-wrap">
        <div class="brand">
          <span class="brand-mark">C</span>
          <span>CodersLab | MyTechShelf</span>
        </div>
        <button type="button" class="admin-menu-toggle" aria-label="Open admin menu" aria-expanded="false">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
        <nav class="admin-nav">
          <a href="/admin/dashboard">Dashboard</a>
          <a href="/admin/books" class="active">Add Book</a>
          <a href="/admin/payment">Payment</a>
          <a href="/admin/buyers">Buyers</a>
        </nav>
        <button type="button" class="btn btn-secondary admin-logout">Logout</button>
      </div>
    </header>

    <main class="admin-page container">
      <section class="admin-grid">
        <div class="admin-panel">
          <div class="panel-head">
            <h2>Add new book</h2>
          </div>
          <form id="addBookForm" class="admin-form" enctype="multipart/form-data">
            <label>
              Book title
              <input type="text" name="title" required />
            </label>
            <label>
              Author
              <input type="text" name="author" required />
            </label>
            <label>
              Category
              <select name="category" id="bookCategory" required>
                <option value="Programming Books">Programming Books</option>
                <option value="Interview Practice Books">Interview Practice Books</option>
                <option value="School Notes">School Notes</option>
                <option value="Competitive Exam Notes">Competitive Exam Notes</option>
              </select>
            </label>
            <div class="field-grid">
              <label class="school-book-field">
                Class / Standard
                <select name="std" id="bookStd">
                  <option value="">Select class</option>
                  <option value="6">6th</option>
                  <option value="7">7th</option>
                  <option value="8">8th</option>
                  <option value="9">9th</option>
                  <option value="10">10th</option>
                  <option value="11">11th</option>
                  <option value="12">12th</option>
                </select>
              </label>
              <label class="school-book-field">
                Subject
                <select name="subject" id="bookSubject">
                  <option value="">Select subject</option>
                  <option value="Maths">Maths</option>
                  <option value="Science">Science</option>
                  <option value="English">English</option>
                  <option value="Tamil">Tamil</option>
                  <option value="Social Science">Social Science</option>
                  <option value="Computer Science">Computer Science</option>
                  <option value="Physics">Physics</option>
                  <option value="Chemistry">Chemistry</option>
                  <option value="Biology">Biology</option>
                  <option value="Commerce">Commerce</option>
                  <option value="Aptitude">Aptitude</option>
                  <option value="Reasoning">Reasoning</option>
                  <option value="General Knowledge">General Knowledge</option>
                  <option value="Current Affairs">Current Affairs</option>
                </select>
              </label>
            </div>
            <label>
              Price (₹)
              <input type="number" name="price" min="1" required />
            </label>
            <label>
              Description
              <textarea name="description" rows="4" required></textarea>
            </label>
            <label class="file-upload-label">
              Book cover image
              <input type="file" name="images" accept="image/*" multiple required />
            </label>
            <button class="btn btn-primary" type="submit">Add Book</button>
          </form>
          <p id="adminMessage" class="form-message" aria-live="polite"></p>
        </div>

        <div class="admin-panel">
          <div class="panel-head">
            <h2>Inventory</h2>
          </div>
          <div id="bookInventory" class="inventory-list"></div>
        </div>
      </section>
    </main>

    <script src="/admin-nav.js?v=20261102-1"></script>
    <script src="/admin-books.js?v=20261102-1"></script>
  </body>
</html>
