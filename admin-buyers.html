<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodersLab Buyers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="admin-body">
    <header class="topbar admin-bar">
      <div class="container nav-wrap admin-nav-wrap">
        <div class="brand">
          <span class="brand-mark">C</span>
          <span>CodersLab | MyTechShelf</span>
        </div>
        <button type="button" class="admin-menu-toggle" aria-label="Open admin menu" aria-expanded="false">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
        <nav class="admin-nav">
          <a href="/admin/dashboard">Dashboard</a>
          <a href="/admin/books">Add Book</a>
          <a href="/admin/payment">Payment</a>
          <a href="/admin/buyers" class="active">Buyers</a>
        </nav>
        <button type="button" class="btn btn-secondary admin-logout">Logout</button>
      </div>
    </header>

    <main class="admin-page container">
      <section class="admin-panel full-width-panel">
        <div class="panel-head">
          <h2>Buyer information</h2>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Buyer</th>
                <th>Email</th>
                <th>WhatsApp</th>
                <th>Book</th>
                <th>Format</th>
                <th>Amount</th>
                <th>Payment</th>
                <th>Sent PDF</th>
                <th>Receipt</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="buyersTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/admin-nav.js?v=20261102-1"></script>
    <script src="/admin-buyers.js?v=20261102-1"></script>
