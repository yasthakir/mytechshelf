<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Books | MyTechShelf</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-wrap">
        <div class="brand">
          <span class="brand-mark">TS</span>
          <span>MyTechShelf</span>
        </div>
        <nav class="main-nav">
          <a href="/">Home</a>
          <a href="/more-books">More books</a>
          <a href="/cart">Cart</a>
        </nav>
        <a href="/cart" class="btn btn-secondary cart-pill">Cart <span id="cartCount">0</span></a>
      </div>
    </header>

    <main class="cart-page">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow">Category</span>
            <h2 id="categoryTitle">Books</h2>
          </div>
        </div>

        <div id="schoolFilters" class="filter-row" style="display: none; margin-bottom: 1.25rem;">
          <label>
            Class
            <select id="stdFilter">
              <option value="">All Classes</option>
              <option value="6">6th</option>
              <option value="7">7th</option>
              <option value="8">8th</option>
              <option value="9">9th</option>
              <option value="10">10th</option>
              <option value="11">11th</option>
              <option value="12">12th</option>
            </select>
          </label>
          <label>
            Subject
            <select id="subjectFilter">
              <option value="">All Subjects</option>
              <option value="Maths">Maths</option>
              <option value="Science">Science</option>
              <option value="English">English</option>
              <option value="Tamil">Tamil</option>
              <option value="Social Science">Social Science</option>
              <option value="Computer Science">Computer Science</option>
              <option value="Physics">Physics</option>
              <option value="Chemistry">Chemistry</option>
              <option value="Biology">Biology</option>
              <option value="Commerce">Commerce</option>
              <option value="Aptitude">Aptitude</option>
              <option value="Reasoning">Reasoning</option>
              <option value="General Knowledge">General Knowledge</option>
              <option value="Current Affairs">Current Affairs</option>
            </select>
          </label>
        </div>

        <div id="booksGrid" class="books-grid"></div>
      </div>
    </main>

    <script src="/category-books.js"></script>
  </body>
</html>
