<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>More Books | MyTechShelf</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-wrap">
        <div class="brand">
          <span class="brand-mark">TS</span>
          <span>MyTechShelf</span>
        </div>
        <nav class="main-nav">
          <a href="/">Home</a>
          <a href="/#books">Shop</a>
          <a href="/cart">Cart</a>
        </nav>
        <div class="header-actions">
          <a href="/favorites" class="btn btn-secondary icon-pill favorite-pill" aria-label="Favorite books">
            <span class="header-icon">♡</span>
            <span id="favoriteCount">0</span>
          </a>
          <a href="/cart" class="btn btn-secondary cart-pill" aria-label="Cart">
            <span class="header-icon">🛒</span>
            <span id="cartCount">0</span>
          </a>
          <a href="#contact" class="btn btn-primary support-btn">Support</a>
        </div>
      </div>
    </header>

    <main class="category-choice container">
      <span class="eyebrow">Browse library</span>
      <h1>More books</h1>
      <div class="choice-grid">
        <a class="choice-card" href="/books?category=Programming%20Books">
          <strong>Programming Books</strong>
          <span>Explore complete guides for web, coding, automation, and full-stack development.</span>
        </a>
        <a class="choice-card" href="/books?category=Interview%20Practice%20Books">
          <strong>Interview Practice Books</strong>
          <span>Prepare for real interviews with coding drills, mock patterns, and case practice.</span>
        </a>
      </div>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
